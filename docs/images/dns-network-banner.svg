<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Active Directory and DNS Lab</title>
  <desc id="desc">A dark blue network diagram showing a Windows client, DNS server and domain resolution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/><stop offset="0.55" stop-color="#0b2447"/><stop offset="1" stop-color="#0b3b66"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#60a5fa" stroke-opacity="0.08"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/><rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="70" r="160" fill="#38bdf8" opacity="0.06"/><circle cx="1080" cy="70" r="105" fill="#60a5fa" opacity="0.06"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="70" y="73" fill="#7dd3fc" font-size="16" font-weight="700" letter-spacing="4">WINDOWS SERVER LAB</text>
    <text x="70" y="135" fill="#f8fafc" font-size="45" font-weight="750">Active Directory &amp; DNS</text>
    <text x="70" y="175" fill="#b8c8df" font-size="20">Hostname ↔ IPv4 resolution with managed DNS zones</text>
    <g transform="translate(70 220)"><rect width="160" height="46" rx="23" fill="#0f2f52" stroke="#38bdf8" stroke-opacity="0.55"/><circle cx="25" cy="23" r="7" fill="#22c55e" filter="url(#glow)"/><text x="44" y="29" fill="#dbeafe" font-size="15" font-weight="650">DNS ACTIVE</text></g>
    <text x="70" y="301" fill="#7890ad" font-size="14">FORWARD ZONE  •  REVERSE ZONE  •  A / PTR / CNAME</text>
  </g>
  <g transform="translate(710 57)" font-family="Segoe UI, Arial, sans-serif">
    <path d="M90 112H220M284 112H410" fill="none" stroke="url(#line)" stroke-width="3" stroke-dasharray="8 8"/><path d="M220 112l-12-7v14zM410 112l-12-7v14z" fill="#38bdf8"/>
    <circle cx="156" cy="112" r="5" fill="#7dd3fc" filter="url(#glow)"/><circle cx="347" cy="112" r="5" fill="#7dd3fc" filter="url(#glow)"/>
    <g><rect x="0" y="73" width="90" height="78" rx="12" fill="#0f2f52" stroke="#4b84b5"/><rect x="18" y="89" width="54" height="34" rx="3" fill="#071426" stroke="#7dd3fc"/><path d="M31 136h28M45 123v13" stroke="#7dd3fc" stroke-width="3"/><text x="45" y="178" fill="#b8c8df" font-size="14" text-anchor="middle">CLIENT</text></g>
    <g><rect x="220" y="48" width="64" height="128" rx="10" fill="#0f2f52" stroke="#38bdf8" stroke-width="2"/><rect x="234" y="66" width="36" height="11" rx="3" fill="#38bdf8" opacity="0.9"/><circle cx="242" cy="99" r="4" fill="#22c55e"/><path d="M252 98h18M240 116h30M240 132h30M240 148h30" stroke="#7890ad" stroke-width="3"/><text x="252" y="205" fill="#e0f2fe" font-size="15" font-weight="700" text-anchor="middle">DNS</text><text x="252" y="223" fill="#7890ad" font-size="12" text-anchor="middle">SERVER</text></g>
    <g><circle cx="452" cy="112" r="55" fill="#0f2f52" stroke="#4b84b5"/><ellipse cx="452" cy="112" rx="27" ry="55" fill="none" stroke="#7dd3fc" stroke-opacity="0.75"/><path d="M397 112h110M405 87h94M405 137h94" fill="none" stroke="#7dd3fc" stroke-opacity="0.75"/><text x="452" y="196" fill="#b8c8df" font-size="14" text-anchor="middle">DOMAIN</text></g>
    <rect x="118" y="65" width="78" height="25" rx="12" fill="#082f49"/><text x="157" y="82" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">QUERY</text><rect x="309" y="135" width="78" height="25" rx="12" fill="#082f49"/><text x="348" y="152" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">ANSWER</text>
  </g>
</svg>
